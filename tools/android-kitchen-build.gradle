// Applied inside the generated app build before Android creates variants.
android {
    defaultConfig { buildConfigField 'boolean', 'KITCHEN_PREVIEW', 'false' }
    buildTypes {
        kitchenPreview {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'KITCHEN_PREVIEW', 'true'
        }
    }
}

// Shared workspace sources are outside the Android app's default JS input root.
// Without these inputs Gradle can ship a stale bundle after knowledge/tool edits.
tasks.configureEach { task ->
    if (task.name.startsWith('createBundle') && task.name.endsWith('JsAndAssets')) {
        task.inputs.files(fileTree(new File(rootProject.projectDir, '../../../packages')) {
            include '**/src/**/*.ts', '**/src/**/*.tsx'
        }).withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    }
}
